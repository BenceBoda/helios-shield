name: Fetch live magnetometer data
# Superseded by refresh-live.yml (one commit for both feeds); kept for manual runs.
on:
  workflow_dispatch:

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch USGS + INTERMAGNET and compute dB/dt
        run: python3 scripts/fetch_live_magnetometers.py

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add live_stations.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore: update live magnetometer data [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
