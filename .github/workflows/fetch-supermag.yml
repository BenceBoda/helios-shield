name: Fetch SuperMAG real-time data

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch SuperMAG data
        env:
          SM_USER: ${{ secrets.SUPERMAG_USER }}
        run: |
          START=$(date -u -d '60 minutes ago' '+%Y-%m-%dT%H:%M:%S.000Z')
          echo "User: ${SM_USER}"
          curl -sf --max-time 30 -G \
            "https://supermag.jhuapl.edu/services/data.php" \
            --data-urlencode "user=${SM_USER}" \
            -d "start=${START}" \
            -d "interval=60" \
            -d "stations=KIR,ESK,HAD,OTT,HER,FRD,BRW" \
            -d "fmt=json" \
            -o supermag_raw.json || echo '[]' > supermag_raw.json
          echo "Response size: $(wc -c < supermag_raw.json) bytes"
          head -c 500 supermag_raw.json

      - name: Parse SuperMAG data
        run: |
          python3 -c '
          import json, sys, math, datetime
          ts = datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ")
          try:
              with open("supermag_raw.json") as f:
                  data = json.load(f)
          except Exception as e:
              print(json.dumps({"stations": [], "fetched_at": ts, "error": str(e)}))
              sys.exit(0)
          if not isinstance(data, list) or not data:
              print(json.dumps({"stations": [], "fetched_at": ts, "raw": str(data)[:300]}))
              sys.exit(0)
          out = {}
          for r in data:
              sid = (r.get("iaga") or r.get("IAGA") or r.get("station") or "").upper().strip()
              if not sid:
                  continue
              try:
                  n = float(r.get("dbn_nez") or r.get("Bn") or r.get("bn") or 0)
                  e2 = float(r.get("dbe_nez") or r.get("Be") or r.get("be") or 0)
              except (TypeError, ValueError):
                  n = e2 = 0.0
              dbdt = round(math.sqrt(n * n + e2 * e2) * 10) / 10
              if sid not in out or dbdt > out[sid]["dbdt"]:
                  try:
                      lat = float(r.get("geolatitude") or r.get("lat") or 0)
                      lng = float(r.get("geolongitude") or r.get("lng") or r.get("lon") or 0)
                  except (TypeError, ValueError):
                      lat = lng = 0.0
                  out[sid] = {"id": sid, "lat": lat, "lng": lng, "dbdt": dbdt, "time": str(r.get("tval") or r.get("time") or "")}
          print(json.dumps({"stations": list(out.values()), "fetched_at": ts}))
          ' > supermag.json
          echo "Result:"
          cat supermag.json

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add supermag.json supermag_raw.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore: update supermag data [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
