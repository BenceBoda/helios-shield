name: Fetch SuperMAG real-time data

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch and parse SuperMAG data
        run: |
          set -e
          START=$(date -u -d '30 minutes ago' '+%Y-%m-%dT%H:%M:%S.000Z')
          STATIONS="KIR,ESK,BFE,HAD,OTT,HER,FRD,BRW,YKC,MEA,ABK,TRO,UPS,HON,CNB,NEW,SIT,STJ"
          URL="https://supermag.jhuapl.edu/services/data.php?user=BenceBoda&start=${START}&interval=30&stations=${STATIONS}&delta=start&fmt=json"

          echo "Fetching: $URL"
          touch supermag_raw.json
          HTTP_CODE=$(curl -s -w "%{http_code}" --max-time 30 "$URL" -o supermag_raw.json)
          echo "HTTP status: $HTTP_CODE"
          echo "Response size: $(wc -c < supermag_raw.json) bytes"
          cat supermag_raw.json | head -c 500

          if [ ! -s supermag_raw.json ]; then
            echo "Empty response — skipping"
            exit 0
          fi

          TS=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          jq --arg ts "$TS" '
            if type == "array" then
              reduce .[] as $r ({};
                ($r.iaga | ascii_upcase) as $id |
                (($r.dbn_nez // 0) as $n | ($r.dbe_nez // 0) as $e | ($n*$n + $e*$e) | sqrt) as $d |
                if (.[$id] == null or $d > .[$id].dbdt)
                then .[$id] = {id: $id, lat: $r.geolatitude, lng: $r.geolongitude, dbdt: ($d * 10 | round / 10), time: $r.tval}
                else . end
              ) | {stations: [.[]], fetched_at: $ts}
            else {stations: [], fetched_at: $ts, raw: .}
            end
          ' supermag_raw.json > supermag.json || echo "jq failed, skipping"

          echo "Result: $(cat supermag.json | head -c 200)"

      - name: Commit supermag.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add supermag.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore: update supermag.json [skip ci]"
          git push origin HEAD:main
