name: Fetch SuperMAG data
# SuperMAG has no near-real-time data (newest is weeks-months old), so no schedule:
# run by hand; live dB/dt will come from a real-time magnetometer source instead.
on:
  workflow_dispatch:

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch SuperMAG and compute dB/dt
        env:
          SM_LOGON: ${{ secrets.SUPERMAG_USER }}
        run: python3 scripts/fetch_supermag.py

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm -q --cached --ignore-unmatch supermag_raw.json
          rm -f supermag_raw.json
          git add supermag.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore: update SuperMAG data [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
