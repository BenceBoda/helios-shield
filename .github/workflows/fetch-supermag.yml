name: Fetch SuperMAG real-time data

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch SuperMAG data
        run: |
          START=$(date -u -d '30 minutes ago' '+%Y-%m-%dT%H:%M:%S.000Z')
          STATIONS="KIR,ESK,BFE,HAD,OTT,HER,FRD,BRW,YKC,MEA,ABK,TRO,UPS,HON,CNB,NEW,SIT,STJ"
          curl -s --max-time 30 \
            "https://supermag.jhuapl.edu/services/data.php?user=BenceBoda&start=${START}&interval=30&stations=${STATIONS}&delta=start&fmt=json" \
            -o supermag_raw.json || true
          if [ ! -s supermag_raw.json ]; then
            echo "Empty response"
            exit 0
          fi
          python3 - << 'EOF'
import json, math, datetime, sys
try:
    raw = json.load(open('supermag_raw.json'))
except Exception as e:
    print(f"JSON error: {e}"); sys.exit(0)
stations = {}
if isinstance(raw, list):
    for rec in raw:
        iaga = rec.get('iaga','').upper()
        if not iaga: continue
        dbn = float(rec.get('dbn_nez') or 0)
        dbe = float(rec.get('dbe_nez') or 0)
        dbdt = math.sqrt(dbn**2 + dbe**2)
        if iaga not in stations or dbdt > stations[iaga]['dbdt']:
            stations[iaga] = {'id':iaga,'lat':rec.get('geolatitude',0),'lng':rec.get('geolongitude',0),'dbdt':round(dbdt,1),'time':rec.get('tval','')}
out = {'stations':list(stations.values()),'fetched_at':datetime.datetime.utcnow().strftime('%Y-%m-%dT%H:%M:%SZ')}
json.dump(out, open('supermag.json','w'))
print(f"Wrote {len(stations)} stations")
EOF

      - name: Commit supermag.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add supermag.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore: update supermag.json [skip ci]"
          git push origin HEAD:main
