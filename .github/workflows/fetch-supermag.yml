name: Fetch SuperMAG real-time data

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch SuperMAG data
        env:
          SM_USER: ${{ secrets.SUPERMAG_USER }}
        run: |
          START=$(date -u -d '60 minutes ago' '+%Y-%m-%dT%H:%M:%S.000Z')
          ENCODED_USER=$(python3 -c "import urllib.parse,os; print(urllib.parse.quote(os.environ['SM_USER']))")
          URL="https://supermag.jhuapl.edu/services/data.php?user=${ENCODED_USER}&start=${START}&interval=60&stations=KIR,ESK,HAD,OTT,HER,FRD,BRW&fmt=json"
          echo "Fetching SuperMAG data..."
          curl -sf --max-time 30 "$URL" -o supermag_raw.json || echo '[]' > supermag_raw.json
          echo "Response size: $(wc -c < supermag_raw.json) bytes"
          echo "Preview:"
          head -c 500 supermag_raw.json

      - name: Parse SuperMAG data
        run: |
          python3 parse_supermag.py > supermag.json
          echo "Result:"
          cat supermag.json

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add supermag.json supermag_raw.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore: update supermag data [skip ci]"
          git push origin HEAD:main          if [ ! -s supermag_raw.json ]; then
            echo "{\"stations\":[],\"fetched_at\":\"${TS}\",\"error\":\"empty_response\"}" > supermag.json
            exit 0
          fi
          jq --arg ts "$TS" '
            def tonum: if type == "number" then . elif type == "string" then tonumber? // 0 else 0 end;
            if type == "array" and length > 0 then
              reduce .[] as $r ({};
                (($r.iaga // $r.IAGA // $r.station // "") | ascii_upcase) as $id |
                if $id == "" then . else
                  (($r.dbn_nez // $r.Bn // $r.bn // 0 | tonum) as $n |
                   ($r.dbe_nez // $r.Be // $r.be // 0 | tonum) as $e |
                   ($n*$n + $e*$e) | sqrt) as $d |
                  if (.[$id] == null or $d > .[$id].dbdt)
                  then .[$id] = {id: $id, lat: ($r.geolatitude // $r.lat // 0 | tonum), lng: ($r.geolongitude // $r.lng // $r.lon // 0 | tonum), dbdt: ($d * 10 | round / 10), time: ($r.tval // $r.time // "")}
                  else . end
                end
              ) | {stations: [.[]], fetched_at: $ts}
            else
              {stations: [], fetched_at: $ts, raw_type: (type), raw_preview: (. | tostring | .[0:300])}
            end
          ' supermag_raw.json > supermag.json || echo "{\"stations\":[],\"fetched_at\":\"${TS}\",\"error\":\"jq_failed\"}" > supermag.json
          echo "Result:"
          cat supermag.json

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add supermag.json supermag_raw.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore: update supermag data [skip ci]"
          git push origin HEAD:main
