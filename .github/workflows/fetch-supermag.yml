name: Fetch SuperMAG real-time data

on:
  schedule:
    - cron: '*/10 * * * *'   # every 10 minutes (SuperMAG has ~5 min latency)
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch SuperMAG dB/dt (last 30 min, key stations)
        run: |
          START=$(date -u -d '30 minutes ago' '+%Y-%m-%dT%H:%M:%S.000Z')
          INTERVAL=30
          STATIONS="KIR,ESK,BFE,HAD,OTT,HER,FRD,BRW,YKC,MEA,ABK,TRO,UPS,HON,CNB,NEW,SIT,STJ"

          curl -s --max-time 30 \
            "https://supermag.jhuapl.edu/services/data.php?user=BenceBoda&start=${START}&interval=${INTERVAL}&stations=${STATIONS}&delta=start&fmt=json" \
            -o supermag_raw.json

          # Validate: must be non-empty JSON array
          if [ ! -s supermag_raw.json ] || ! python3 -c "import json,sys; d=json.load(open('supermag_raw.json')); sys.exit(0 if isinstance(d,(list,dict)) else 1)" 2>/dev/null; then
            echo "SuperMAG fetch failed or returned invalid JSON — keeping previous supermag.json"
            exit 0
          fi

          # Transform to {stations:[{id, lat, lng, dbdt, time}], fetched_at}
          python3 - <<'PYEOF'
          import json, math, datetime

          with open('supermag_raw.json') as f:
              raw = json.load(f)

          stations = {}
          # raw is a list of records: [{iaga, geolatitude, geolongitude, dbn_nez, dbe_nez, dbz_nez, tval, ...}, ...]
          if isinstance(raw, list):
              for rec in raw:
                  iaga = rec.get('iaga','').upper()
                  if not iaga:
                      continue
                  dbn = rec.get('dbn_nez', 0) or 0
                  dbe = rec.get('dbe_nez', 0) or 0
                  dbdt = math.sqrt(dbn**2 + dbe**2)  # horizontal magnitude in nT/min
                  if iaga not in stations or dbdt > stations[iaga]['dbdt']:
                      stations[iaga] = {
                          'id': iaga,
                          'lat': rec.get('geolatitude', 0),
                          'lng': rec.get('geolongitude', 0),
                          'dbdt': round(dbdt, 1),
                          'time': rec.get('tval', ''),
                      }

          out = {
              'stations': list(stations.values()),
              'fetched_at': datetime.datetime.utcnow().strftime('%Y-%m-%dT%H:%M:%SZ'),
          }
          with open('supermag.json', 'w') as f:
              json.dump(out, f)
          print(f"Wrote {len(stations)} stations to supermag.json")
          PYEOF

      - name: Commit supermag.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add supermag.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore: update supermag.json [skip ci]"
          git push
