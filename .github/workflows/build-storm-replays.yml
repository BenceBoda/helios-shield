name: Build storm replay data
on:
  workflow_dispatch:

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch SuperMAG, OMNI and Kp for historical storms
        env:
          SM_LOGON: ${{ secrets.SUPERMAG_USER }}
        run: python3 scripts/build_storm_replays.py

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add storms/
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore: rebuild storm replay data [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
