name: Refresh live data
# Triggered every 10 min by an external scheduler (cron-job.org) through the
# workflow_dispatch API, because GitHub's own schedule runs hours late.
# The hourly schedule below is only a backup. One run = one commit = one Pages build,
# which keeps us under the Pages limit of ~10 builds per hour.
on:
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: NOAA Kp and solar wind
        run: python3 -u scripts/fetch_noaa.py || echo "NOAA fetch failed, keeping previous files"

      - name: USGS + INTERMAGNET magnetometers
        run: python3 -u scripts/fetch_live_magnetometers.py || echo "magnetometer fetch failed, keeping previous file"

      - name: Commit data
        run: |
          # The three files are whole-file snapshots, so the newest fetch simply wins:
          # put our files on top of the latest main instead of merging (no conflicts
          # when another refresh pushed in between), and retry a few times.
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/fresh && cp kp.json bz.json live_stations.json /tmp/fresh/
          for i in 1 2 3 4; do
            git fetch -q origin main
            git reset -q --hard origin/main
            cp /tmp/fresh/*.json .
            git add kp.json bz.json live_stations.json
            if git diff --cached --quiet; then echo "No changes"; exit 0; fi
            git commit -q -m "chore: refresh live data [skip ci]"
            if git push -q origin HEAD:main; then echo "pushed"; exit 0; fi
            echo "push rejected, retry $i"; sleep $((i * 5))
          done
          exit 1
