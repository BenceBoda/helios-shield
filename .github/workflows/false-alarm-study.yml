name: False-alarm study
on:
  workflow_dispatch:
    inputs:
      years:
        description: Years to evaluate, separated by spaces
        default: '2024'

# Own group: the 5-minute data workflows must not replace a queued study run
concurrency:
  group: false-alarm-study
  cancel-in-progress: false

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Run the V1 rule over each year and compare with ground dB/dt
        env:
          YEARS: ${{ inputs.years }}
        run: |
          for y in $YEARS; do
            echo "##### $y"
            STUDY_YEAR=$y python3 -u scripts/false_alarm_study.py || echo "year $y failed"
          done

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add analysis/
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore: false-alarm study results [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
