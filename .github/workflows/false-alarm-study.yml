name: False-alarm study
on:
  workflow_dispatch:
    inputs:
      year:
        description: Year to evaluate
        default: '2024'

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  study:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Run the V1 rule over a full year and compare with ground dB/dt
        timeout-minutes: 120
        env:
          STUDY_YEAR: ${{ inputs.year }}
        run: python3 -u scripts/false_alarm_study.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add analysis/
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore: false-alarm study results [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
